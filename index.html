<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<title>乱世·弈界 - 联机版</title>
	<style>
		/* === 聊天系统样式 === */
		#chat-panel {
			position: fixed;
			bottom: 8px;
			left: 8px;
			width: 320px;
			background: rgba(15, 15, 30, .92);
			border: 1px solid #d4af37;
			border-radius: 8px;
			z-index: 25;
			display: flex;
			flex-direction: column;
			font-size: 13px;
			transition: opacity .3s;
		}

		#chat-panel.minimized {
			height: 36px;
			overflow: hidden;
		}

		#chat-header {
			padding: 6px 12px;
			background: rgba(212, 175, 55, .15);
			cursor: pointer;
			display: flex;
			justify-content: space-between;
			align-items: center;
			color: #ffd700;
			font-weight: bold;
			user-select: none;
		}

		#chat-body {
			flex: 1;
			display: flex;
			flex-direction: column;
			min-height: 0;
		}

		#chat-tabs {
			display: flex;
			border-bottom: 1px solid #444;
		}

		.chat-tab {
			flex: 1;
			padding: 5px;
			text-align: center;
			cursor: pointer;
			color: #888;
			font-size: 12px;
			transition: .2s;
		}

		.chat-tab.active {
			color: #ffd700;
			background: rgba(255, 215, 0, .1);
		}

		#chat-messages {
			flex: 1;
			overflow-y: auto;
			padding: 6px 10px;
			max-height: 200px;
			min-height: 120px;
			line-height: 1.5;
			word-break: break-all;
		}

		#chat-messages::-webkit-scrollbar {
			width: 4px;
		}

		#chat-messages::-webkit-scrollbar-thumb {
			background: #555;
			border-radius: 2px;
		}

		.chat-line {
			margin: 2px 0;
		}

		.chat-line .cname {
			font-weight: bold;
			margin-right: 4px;
		}

		.chat-line.sys {
			color: #f39c12;
			font-style: italic;
		}

		.chat-line.team {
			color: #7bed9f;
		}

		.chat-line.all {
			color: #ccc;
		}

		#chat-input-row {
			display: flex;
			border-top: 1px solid #444;
		}

		#chat-channel-btn {
			padding: 6px 10px;
			background: rgba(255, 215, 0, .1);
			color: #ffd700;
			border: none;
			cursor: pointer;
			font-size: 12px;
			white-space: nowrap;
			font-family: inherit;
		}

		#chat-channel-btn:hover {
			background: rgba(255, 215, 0, .2);
		}

		#chat-input {
			flex: 1;
			padding: 6px 10px;
			background: transparent;
			border: none;
			color: #eee;
			font-size: 13px;
			outline: none;
			font-family: inherit;
		}

		#chat-send {
			padding: 6px 14px;
			background: #d4af37;
			color: #1a1a2e;
			border: none;
			cursor: pointer;
			font-weight: bold;
			font-family: inherit;
		}

		#chat-send:hover {
			background: #ffd700;
		}

		/* 未读提示小红点 */
		.chat-tab .unread {
			display: inline-block;
			width: 7px;
			height: 7px;
			background: #e74c3c;
			border-radius: 50%;
			margin-left: 3px;
			vertical-align: middle;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box
		}

		body {
			overflow: hidden;
			background: #1a1a2e;
			font-family: 'STKaiti', 'KaiTi', serif;
			user-select: none;
			color: #eee
		}

		canvas {
			display: block;
			cursor: crosshair
		}

		.screen {
			position: fixed;
			inset: 0;
			z-index: 200;
			background: radial-gradient(ellipse at center, #2a2a4e 0%, #12121f 100%);
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			overflow-y: auto;
			padding: 20px
		}

		h1.title {
			font-size: 52px;
			color: #ffd700;
			letter-spacing: 10px;
			text-shadow: 0 0 40px rgba(255, 215, 0, .6);
			margin-bottom: 8px
		}

		.sub {
			color: #aaa;
			font-size: 17px;
			margin-bottom: 25px;
			letter-spacing: 3px
		}

		.lobby-box,
		.setup-panel {
			background: rgba(255, 255, 255, .05);
			border: 2px solid #555;
			border-radius: 14px;
			padding: 22px 30px;
			margin-top: 15px;
			text-align: center;
			max-width: 600px;
			width: 90%
		}

		.setup-panel .row,
		.lobby-box .row {
			margin: 10px 0;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			flex-wrap: wrap
		}

		.setup-panel label,
		.lobby-box label {
			font-size: 17px;
			color: #ddd
		}

		.setup-panel input,
		.setup-panel select,
		.lobby-box input {
			width: 90px;
			padding: 7px 10px;
			font-size: 17px;
			background: #2a2a4e;
			color: #ffd700;
			border: 2px solid #d4af37;
			border-radius: 8px;
			text-align: center;
			font-family: inherit
		}

		.lobby-box input.name {
			width: 180px
		}

		.big-btn {
			margin-top: 15px;
			padding: 14px 40px;
			font-size: 20px;
			background: #c0392b;
			color: #fff;
			border: 2px solid #fff;
			border-radius: 10px;
			cursor: pointer;
			font-family: inherit;
			transition: .3s
		}

		.big-btn:hover {
			background: #e74c3c;
			transform: scale(1.05)
		}

		.big-btn.green {
			background: #27ae60
		}

		.big-btn.green:hover {
			background: #2ecc71
		}

		.big-btn.blue {
			background: #2980b9
		}

		.big-btn.blue:hover {
			background: #3498db
		}

		.room-code {
			font-size: 34px;
			color: #ffd700;
			letter-spacing: 6px;
			margin: 10px 0;
			font-weight: bold
		}

		.player-list {
			margin: 12px 0;
			text-align: left;
			min-width: 220px
		}

		.player-list div {
			padding: 6px 14px;
			margin: 3px 0;
			background: rgba(255, 255, 255, .05);
			border-radius: 6px;
			font-size: 15px
		}

		.player-list div.host::after {
			content: ' 👑';
		}

		.waiting-text {
			color: #aaa;
			font-size: 14px;
			margin-top: 10px;
			animation: blink 1.5s infinite
		}

		@keyframes blink {

			0%,
			100% {
				opacity: 1
			}

			50% {
				opacity: .4
			}
		}

		.team-row {
			display: flex;
			gap: 12px;
			align-items: center;
			margin: 8px 0;
			padding: 10px 18px;
			background: rgba(255, 255, 255, .05);
			border-radius: 10px;
			flex-wrap: wrap
		}

		.team-row .pname {
			width: 90px;
			font-size: 17px;
			font-weight: bold
		}

		.team-btn {
			padding: 7px 15px;
			border-radius: 8px;
			cursor: pointer;
			border: 2px solid #555;
			background: transparent;
			color: #ccc;
			font-family: inherit;
			font-size: 14px;
			transition: .2s;
			margin: 2px
		}

		.team-btn.active-A {
			border-color: #e74c3c;
			background: rgba(231, 76, 60, .25);
			color: #fff
		}

		.team-btn.active-B {
			border-color: #3498db;
			background: rgba(52, 152, 219, .25);
			color: #fff
		}

		.team-btn.active-C {
			border-color: #2ecc71;
			background: rgba(46, 204, 113, .25);
			color: #fff
		}

		.team-btn.active-D {
			border-color: #f39c12;
			background: rgba(243, 156, 18, .25);
			color: #fff
		}

		.team-btn.active-S {
			border-color: #f39c12;
			background: rgba(243, 156, 18, .25);
			color: #fff
		}

		.faction-row {
			display: flex;
			gap: 10px;
			margin-bottom: 20px;
			flex-wrap: wrap;
			justify-content: center
		}

		.faction-pick {
			width: 90px;
			padding: 12px 6px;
			border-radius: 10px;
			text-align: center;
			cursor: pointer;
			border: 3px solid #444;
			transition: .2s;
			font-size: 16px;
			font-weight: bold
		}

		.faction-pick:hover {
			transform: translateY(-4px)
		}

		.faction-pick.taken {
			opacity: .3;
			pointer-events: none
		}

		.faction-pick.chosen {
			border-color: #ffd700;
			box-shadow: 0 0 20px rgba(255, 215, 0, .5)
		}

		.general-grid {
			display: flex;
			gap: 12px;
			flex-wrap: wrap;
			justify-content: center;
			max-width: 1100px
		}

		.general-card {
			width: 145px;
			padding: 12px 8px;
			background: rgba(255, 255, 255, .06);
			border: 2px solid #555;
			border-radius: 10px;
			cursor: pointer;
			transition: .2s;
			text-align: center
		}

		.general-card:hover {
			border-color: #ffd700;
			transform: translateY(-5px)
		}

		.general-card.picked {
			border-color: #2ecc71;
			background: rgba(46, 204, 113, .2)
		}

		.general-card .gname {
			font-size: 18px;
			font-weight: bold;
			color: #ffd700
		}

		.general-card .ghp {
			font-size: 12px;
			color: #2ecc71;
			margin: 3px 0
		}

		.general-card .gskill {
			font-size: 13px;
			color: #7bed9f;
			margin: 3px 0
		}

		.general-card .gdesc {
			font-size: 11px;
			color: #bbb;
			line-height: 1.3;
			min-height: 44px
		}

		.pick-status {
			font-size: 19px;
			color: #ffd700;
			margin: 15px 0
		}

		.hidden {
			display: none !important
		}

		#ui-top {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 6px 12px;
			background: rgba(20, 20, 40, .93);
			border-bottom: 2px solid #d4af37;
			z-index: 10;
			flex-wrap: wrap
		}

		.fbadge {
			padding: 3px 8px;
			border-radius: 4px;
			font-size: 11px;
			font-weight: bold;
			color: #fff;
			margin: 1px;
			white-space: nowrap
		}

		.fbadge.dead {
			opacity: .35;
			text-decoration: line-through
		}

		#turn-info {
			color: #ffd700;
			font-size: 15px;
			font-weight: bold
		}

		#equip-panel {
			position: fixed;
			top: 50px;
			right: 8px;
			width: 210px;
			max-height: calc(100vh - 220px);
			overflow-y: auto;
			background: rgba(15, 15, 30, .92);
			border: 1px solid #d4af37;
			border-radius: 8px;
			padding: 8px;
			z-index: 12;
			font-size: 12px
		}

		#equip-panel h3 {
			color: #ffd700;
			font-size: 13px;
			text-align: center;
			margin-bottom: 5px;
			border-bottom: 1px solid #555;
			padding-bottom: 4px
		}

		.eq-unit {
			border: 1px solid #444;
			border-radius: 6px;
			margin-bottom: 4px;
			overflow: hidden;
			cursor: pointer
		}

		.eq-head {
			display: flex;
			align-items: center;
			gap: 5px;
			padding: 4px 6px;
			background: rgba(255, 255, 255, .05);
			font-size: 12px
		}

		.eq-dot {
			width: 9px;
			height: 9px;
			border-radius: 50%
		}

		.eq-name {
			font-weight: bold
		}

		.eq-hp {
			margin-left: auto;
			color: #2ecc71;
			font-size: 11px
		}

		.eq-icons {
			font-size: 10px;
			color: #bbb;
			padding: 2px 6px
		}

		.eq-detail {
			display: none;
			padding: 5px;
			background: rgba(0, 0, 0, .4);
			line-height: 1.4;
			font-size: 11px;
			border-top: 1px dashed #555
		}

		.eq-unit.open .eq-detail {
			display: block
		}

		.eq-detail .sk {
			color: #7bed9f
		}

		.eq-detail .wp {
			color: #f39c12
		}

		.eq-detail .ar {
			color: #74b9ff
		}

		#tooltip {
			position: fixed;
			display: none;
			background: rgba(10, 10, 25, .96);
			border: 1px solid #d4af37;
			border-radius: 8px;
			padding: 9px 12px;
			font-size: 12.5px;
			line-height: 1.6;
			z-index: 60;
			pointer-events: none;
			max-width: 250px
		}

		#hand-area {
			position: fixed;
			bottom: 8px;
			left: 50%;
			transform: translateX(-50%);
			display: flex;
			gap: 8px;
			padding: 10px 14px;
			background: rgba(20, 15, 10, .95);
			border: 2px solid #d4af37;
			border-radius: 10px;
			max-width: 96vw;
			overflow-x: auto;
			z-index: 20;
			align-items: flex-end
		}

		.card {
			width: 95px;
			height: 130px;
			border: 2px solid #5c4033;
			border-radius: 7px;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			align-items: center;
			cursor: pointer;
			transition: all .2s;
			color: #fff;
			text-shadow: 1px 1px 2px #000;
			padding: 5px 3px;
			flex-shrink: 0
		}

		.card:hover {
			transform: translateY(-14px) scale(1.05);
			z-index: 30
		}

		.card.selected {
			transform: translateY(-22px);
			box-shadow: 0 0 20px #ffd700;
			border-color: #ffd700;
			z-index: 31
		}

		.card-top {
			font-weight: bold;
			font-size: 14px;
			text-align: center;
			line-height: 1.2;
			margin-top: 3px
		}

		.card-elem {
			font-size: 10px;
			opacity: .85
		}

		.card-desc {
			background: rgba(255, 255, 255, .92);
			color: #222;
			font-size: 11px;
			line-height: 1.3;
			padding: 3px 4px;
			border-radius: 4px;
			text-align: center;
			width: 94%;
			text-shadow: none;
			margin-bottom: 3px;
			min-height: 32px;
			display: flex;
			align-items: center;
			justify-content: center
		}

		.elem-jin {
			background: linear-gradient(160deg, #95a5a6, #dfe6e9);
			color: #2d3436 !important
		}

		.elem-mu {
			background: linear-gradient(160deg, #1e8449, #58d68d)
		}

		.elem-shui {
			background: linear-gradient(160deg, #1a5276, #5dade2)
		}

		.elem-huo {
			background: linear-gradient(160deg, #922b21, #f1948a)
		}

		.elem-tu {
			background: linear-gradient(160deg, #935116, #f0b27a)
		}

		.elem-equip {
			background: linear-gradient(160deg, #6c3483, #bb8fce)
		}

		#msg-box {
			position: fixed;
			top: 20%;
			left: 50%;
			transform: translate(-50%, -50%);
			background: rgba(0, 0, 0, .9);
			color: #ffd700;
			padding: 16px 35px;
			border-radius: 10px;
			font-size: 20px;
			pointer-events: none;
			opacity: 0;
			transition: opacity .3s;
			border: 2px solid #d4af37;
			z-index: 50;
			white-space: pre-line;
			text-align: center;
			max-width: 80vw
		}

		#end-turn-btn {
			position: fixed;
			right: 18px;
			bottom: 40px;
			padding: 12px 28px;
			background: linear-gradient(135deg, #8b4513, #a0522d);
			color: #ffd700;
			border-radius: 8px;
			cursor: pointer;
			font-size: 18px;
			border: 2px solid #d4af37;
			z-index: 20;
			font-weight: bold;
			transition: .3s
		}

		#end-turn-btn:hover {
			transform: scale(1.06)
		}

		#turn-overlay {
			position: fixed;
			inset: 0;
			background: rgba(5, 5, 15, .97);
			z-index: 150;
			display: none;
			flex-direction: column;
			justify-content: center;
			align-items: center
		}

		#turn-overlay h1 {
			font-size: 42px;
			margin-bottom: 12px
		}

		#turn-overlay p {
			font-size: 18px;
			color: #aaa;
			margin-bottom: 30px
		}

		#turn-overlay button {
			padding: 14px 50px;
			font-size: 22px;
			background: #c0392b;
			color: #fff;
			border: 2px solid #fff;
			border-radius: 10px;
			cursor: pointer;
			font-family: inherit
		}

		#over-panel {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, .94);
			z-index: 180;
			display: none;
			flex-direction: column;
			justify-content: center;
			align-items: center
		}

		#over-panel h1 {
			font-size: 54px;
			margin-bottom: 15px;
			text-shadow: 0 0 40px currentColor
		}

		#over-panel p {
			font-size: 22px;
			margin-bottom: 30px;
			color: #ddd;
			text-align: center;
			max-width: 500px
		}

		#over-panel button {
			padding: 14px 45px;
			background: #c0392b;
			color: #fff;
			border: 2px solid #fff;
			border-radius: 10px;
			font-size: 22px;
			cursor: pointer;
			font-family: inherit
		}

		#response-overlay {
			position: fixed;
			inset: 0;
			background: rgba(0, 0, 0, .85);
			z-index: 160;
			display: none;
			flex-direction: column;
			justify-content: center;
			align-items: center
		}

		#response-overlay .resp-title {
			font-size: 28px;
			color: #ffd700;
			margin-bottom: 10px
		}

		#response-overlay .resp-desc {
			font-size: 16px;
			color: #ccc;
			margin-bottom: 20px;
			text-align: center;
			max-width: 450px;
			line-height: 1.5
		}

		#response-overlay .resp-cards {
			display: flex;
			gap: 12px;
			flex-wrap: wrap;
			justify-content: center;
			margin-bottom: 20px
		}

		#response-overlay .resp-btn-skip {
			padding: 10px 35px;
			font-size: 17px;
			background: #555;
			color: #fff;
			border: 2px solid #888;
			border-radius: 8px;
			cursor: pointer;
			font-family: inherit
		}

		#net-status {
			position: fixed;
			top: 6px;
			left: 50%;
			transform: translateX(-50%);
			font-size: 12px;
			color: #888;
			z-index: 5
		}
	</style>
</head>

<body>

	<div id="lobby-screen" class="screen">
		<h1 class="title">乱世·弈界</h1>
		<div class="sub">—— 联机对战 ——</div>
		<div class="lobby-box">
			<div class="row"><label>昵称：</label><input id="inp-name" class="name" maxlength="6" placeholder="输入昵称"></div>
			<div style="display:flex;gap:15px;justify-content:center;margin-top:15px">
				<button class="big-btn green" onclick="netCreate()">创建房间</button>
				<button class="big-btn blue" onclick="toggleJoin()">加入房间</button>
			</div>
			<div id="join-box" class="hidden" style="margin-top:15px">
				<input id="inp-room" placeholder="房间号" maxlength="5" style="text-transform:uppercase;width:140px">
				<br><button class="big-btn" style="padding:10px 30px;font-size:16px" onclick="netJoin()">加 入</button>
			</div>
		</div>
	</div>

	<div id="wait-screen" class="screen hidden">
		<h1 class="title" style="font-size:36px">等待室</h1>
		<div class="sub">把房间号分享给好友</div>
		<div class="room-code" id="room-code"></div>
		<div class="player-list" id="player-list"></div>
		<div class="setup-panel hidden" id="host-config">

				if (game.isHuman(t.team)) {
					pendingResponse = {
						targetPlayer: game.controllers[t.team], resume: (used) => {
							if (used) { for (let i = 0; i < need; i++)consume(t.team, peaches[i]); t.hp = 1; bMsg(`🍑 ${t.name}获救！`); }
							else { bMsg(`☠️ ${t.name}阵亡！`); killReward(atk); }
							checkWin(); broadcast(); pumpAI();
						}
					};
					sendTo(game.controllers[t.team], { type: 'needResponse', rt: 'peach', tn: t.name, need, cards: peaches });
					return;
				}
				for (let i = 0; i < need; i++)consume(t.team, peaches[i]); t.hp = 1; bMsg(`🍑 ${t.name}获救！`); return;
			}
			bMsg(`☠️ ${t.name}阵亡！`); killReward(atk); checkWin();
		}
		function killReward(atk) {
			if (!atk) return;
			if (atk.skill === '奸雄') { draw(atk.team, 2); bMsg(`🎴曹操摸2张`); }
			if (atk.skill === '骁将') atk.hp = Math.min(atk.maxHp, atk.hp + 1);
			if (atk.skill === '野心') { draw(atk.team, 1); atk.moved = false; }
			if (atk.skill === '蛮勇') draw(atk.team, 1);
			if (atk.skill === '燕归' || atk.skill === '继志') atk.moved = false;
		}
		function checkTrap(u) { const k = `${u.x},${u.y}`; if (game.terrain[k]) { const n = game.terrain[k]; delete game.terrain[k]; bMsg(`💥${u.name}触发【${n}】`); dealDmg(u, 2, null, null); } }
		function checkWin() {
			if (game.over) return;
			const alive = game.activeFactions.filter(f => game.alive(f).length > 0);
			let winner = null, isTeam = false;
			if (alive.length <= 1) winner = alive[0] || null;
			else {
				const ns = alive.filter(f => game.teamOf(f) !== 'S');
				if (ns.length > 0 && ns.length === alive.length) { const t = game.teamOf(ns[0]); if (ns.every(f => game.teamOf(f) === t)) { winner = ns[0]; isTeam = true; } }
			}
			if (winner || alive.length <= 1) {
				game.over = true;
				const data = { winner, isTeam, fname: winner ? FNAME[winner] : '无', color: winner ? FCOLOR[winner] : '#999', human: winner ? game.isHuman(winner) : false };
				socket.emit('toAll', { type: 'gameOver', ...data }); showGameOver(data);
			}
		}
		function showGameOver(d) {
			const t = document.getElementById('over-title'), p = document.getElementById('over-desc');
			t.innerText = d.winner ? `${d.fname}获胜！` : '同归于尽'; t.style.color = d.color;
			p.innerText = d.winner ? (d.human ? '恭喜获胜！' : 'AI势力席卷八荒！') : '战场已无一人…';
			setTimeout(() => document.getElementById('over-panel').style.display = 'flex', 800);
		}

		/* ==================== 响应 ==================== */
		function showResponsePrompt(d) {
			document.getElementById('resp-title').innerText = d.rt === 'shan' ? '⚠️ 是否出闪？' : '💀 濒死求救！';
			document.getElementById('resp-desc').innerHTML = d.rt === 'shan'
				? `${d.an} → <b style="color:#ffd700">${d.tn}</b><br>【${d.cn}】将造成 ${d.dmg} 点伤害`
				: `<b style="color:#ffd700">${d.tn}</b> 即将阵亡！需要 ${d.need} 个桃`;
			const c = document.getElementById('resp-cards'); c.innerHTML = '';
			(d.cards || []).forEach((card, i) => {
				const div = document.createElement('div'); div.className = `card elem-${card.elem === 'equip' ? 'equip' : card.elem}`;
				div.innerHTML = `<div class="card-top">${card.name}</div><div class="card-desc">${card.desc}</div>`;
				div.onclick = () => respChoose(true, i); c.appendChild(div);
			});
			document.getElementById('resp-skip').innerText = d.rt === 'shan' ? '不出闪' : '放弃救援';
			document.getElementById('response-overlay').style.display = 'flex';
			updateEndBtn();
		}
		function respChoose(use, ci) {
			document.getElementById('response-overlay').style.display = 'none';
			if (NET.isHost) resolveResponse(use, ci);
			else socket.emit('toHost', { type: 'response', use, cardIdx: ci });
		}
		function resolveResponse(use, ci) {
			if (!pendingResponse) return;
			const r = pendingResponse; pendingResponse = null;
			r.resume(use, ci);
			updateEndBtn();
		}
		function pumpAI() { if (pendingResponse || game.over) return; const c = aiCont; aiCont = null; if (c) c(); }

		/* ==================== AI ==================== */
		function aiTurnHost(f) {
			if (game.over) return;
			aiQueue = game.alive(f).slice(); aiStep = 0; aiNext();
		}
		function aiNext() {
			if (game.over || pendingResponse) return;
			if (aiStep >= aiQueue.length) { setTimeout(() => { if (!game.over && !pendingResponse) doEndTurn(); }, 400); return; }
			const u = aiQueue[aiStep++];
			aiAct(u, () => setTimeout(aiNext, 350));
		}
		function aiAct(unit, next) {
			if (unit.hp <= 0 || game.over || unit._noAttack) { next(); return; }
			const enemies = game.allAlive().filter(u => u.team !== unit.team && !game.sameTeam(unit.team, u.team));
			if (!enemies.length) { next(); return; }
			let near = null, md = 999; enemies.forEach(e => { const d = hexDist(unit.x, unit.y, e.x, e.y); if (d < md) { md = d; near = e; } });
			let pos = { x: unit.x, y: unit.y };
			for (let s = 0; s < game.moveSteps(unit); s++) {
				const nb = hexNeighbors(pos.x, pos.y); let best = null, bd = hexDist(pos.x, pos.y, near.x, near.y);
				for (const n of nb) {
					if (game.unitAt(n.x, n.y)) continue;
					if (game.terrain[`${n.x},${n.y}`] && !['骑袭', '白衣', '楼船', '守城', '蛮战', '蛮力', '蛮骑'].includes(unit.skill)) continue;
					const d = hexDist(n.x, n.y, near.x, near.y); if (d < bd) { bd = d; best = n; }
				}
				if (best) pos = best;
			}
			if (pos.x !== unit.x || pos.y !== unit.y) {
				unit.x = pos.x; unit.y = pos.y; unit.moved = true; unit._movedSteps = hexDist(unit.x, unit.y, pos.x, pos.y);
				if (!['骑袭', '白衣', '楼船', '守城', '蛮战', '蛮力', '蛮骑'].includes(unit.skill)) checkTrap(unit);
			}
			broadcast();
			setTimeout(() => {
				if (unit.hp <= 0 || game.over) { next(); return; }
				if (near.hp > 0 && hexDist(unit.x, unit.y, near.x, near.y) <= game.atkRange(unit)) {
					let dmg = calcAttackDmg(unit, near, { dmg: 1, fire: false, elem: 'jin' });
					if (dmg > 0) {
						const blocked = applyDefenseCheck(unit, near, { elem: 'jin', fire: false });
						if (!blocked) {
							const r = tryShan(unit, near, dmg, null, () => { unit.attacked = true; });
							if (r === 'paused') { aiCont = next; broadcast(); return; }
							if (r !== 'blocked') { dealDmg(near, dmg, unit, null); if (pendingResponse) { unit.attacked = true; aiCont = next; broadcast(); return; } }
						}
					}
					unit.attacked = true;
				}
				broadcast(); next();
			}, 300);
		}

		/* ==================== 渲染 ==================== */
		const cvs = document.createElement('canvas'), ctx = cvs.getContext('2d');
		document.body.prepend(cvs);
		function resize() { cvs.width = innerWidth; cvs.height = innerHeight; render(); }
		addEventListener('resize', resize);
		function hexPx(x, y) { const w = HEX * Math.sqrt(3), h = HEX * 2; const ox = (cvs.width - 220 - MAP * w) / 2 + w / 2, oy = (cvs.height - MAP * h * .75) / 2 + h / 2 + 10; return { px: ox + x * w + (y % 2) * (w / 2), py: oy + y * (h * .75) } }
		function pxToHex(mx, my) { let best = null, bd = Infinity; for (let y = 0; y < MAP; y++)for (let x = 0; x < MAP; x++) { const { px, py } = hexPx(x, y); const d = Math.hypot(mx - px, my - py); if (d < HEX * .95 && d < bd) { bd = d; best = { x, y } } } return best }
		function render() {
			if (!ctx) return;
			ctx.clearRect(0, 0, cvs.width, cvs.height); ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, cvs.width, cvs.height);
			if (!game.units.length) return;
			const su = sel.unit, sc = myHand.find(c => c.id === sel.card);
			const myTurn = game.curFaction === NET.myFaction;
			for (let y = 0; y < MAP; y++)for (let x = 0; x < MAP; x++) {
				const { px, py } = hexPx(x, y); const key = `${x},${y}`; let fill = '#2a2a4a', stroke = '#4a4a6a', lw = 1.5;
				if (game.terrain[key]) { fill = '#4a1a1a'; stroke = '#c0392b'; lw = 2 }
				if (su && myTurn && su.team === NET.myFaction) {
					const d = hexDist(su.x, su.y, x, y);
					if (!su.moved && d <= game.moveSteps(su) && !game.unitAt(x, y)) { fill = '#1a4a3a'; stroke = '#2ecc71' }
					if (sc && (sc.type === 'attack' || sc.type === 'fire_attack')) {
						const t = game.unitAt(x, y);
						if (t && t.team !== su.team && !game.sameTeam(su.team, t.team) && d <= game.atkRange(su)) { fill = '#4a1a2a'; stroke = '#e74c3c' }
					}
					if (sc && ['weapon', 'armor', 'heal'].includes(sc.type) && x === su.x && y === su.y) { fill = '#1a3a4a'; stroke = '#3498db' }
					if (sc && sc.type === 'terrain' && !game.unitAt(x, y)) { fill = '#3a3a1a'; stroke = '#f39c12' }
				}
				ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i - Math.PI / 6; i === 0 ? ctx.moveTo(px + HEX * Math.cos(a), py + HEX * Math.sin(a)) : ctx.lineTo(px + HEX * Math.cos(a), py + HEX * Math.sin(a)) }
				ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke();
			}
			game.units.forEach(u => {
				if (u.hp <= 0) return; const { px, py } = hexPx(u.x, u.y), r = HEX * .55;
				ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fillStyle = (sel.unit === u) ? '#f1c40f' : FCOLOR[u.team]; ctx.fill();
				ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
				ctx.fillStyle = '#fff'; ctx.font = `bold ${HEX * .35}px STKaiti`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
				ctx.fillText(u.name[0], px, py);
				const bw = HEX * 1.1, bx = px - bw / 2, by = py + r + 3;
				ctx.fillStyle = '#111'; ctx.fillRect(bx, by, bw, 4);
				ctx.fillStyle = u.hp / u.maxHp > .3 ? '#2ecc71' : '#e74c3c'; ctx.fillRect(bx, by, bw * (u.hp / u.maxHp), 4);
				ctx.font = '10px serif'; if (u.weapon) ctx.fillText('⚔', px - r * .7, py - r * .7); if (u.armor) ctx.fillText('🛡', px + r * .7, py - r * .7);
				const t = game.teamOf(u.team); if (t !== 'S') { ctx.beginPath(); ctx.arc(px, py, r + 3, 0, Math.PI * 2); ctx.strokeStyle = TEAM_COLOR[t]; ctx.lineWidth = 2; ctx.stroke() }
			});
		}
		function renderHand() {
			const h = document.getElementById('hand-area'); h.innerHTML = '';
			if (game.curFaction !== NET.myFaction || game.over) return;
			myHand.forEach(c => {
				const isEq = ['weapon', 'armor'].includes(c.type);
				const d = document.createElement('div');
				d.className = `card elem-${isEq ? 'equip' : c.elem} ${sel.card === c.id ? 'selected' : ''}`;
				d.innerHTML = `<div class="card-top">${c.name}<div class="card-elem">${isEq ? '⚙️' : '[' + c.elem.toUpperCase() + ']'}</div></div><div class="card-desc">${c.desc}</div>`;
				d.onclick = () => { sel.card = (sel.card === c.id) ? null : c.id; renderHand(); render(); };
				h.appendChild(d);
			});
		}
		function renderEquipPanel() {
			const list = document.getElementById('equip-list'); if (!list) return; list.innerHTML = '';
			game.units.forEach(u => {
				if (u.hp <= 0) return;
				const d = document.createElement('div'); d.className = 'eq-unit' + (u._open ? ' open' : '');
				const who = game.isHuman(u.team) ? '玩家' : 'AI'; const t = game.teamOf(u.team);
				d.innerHTML = `<div class="eq-head"><span class="eq-dot" style="background:${FCOLOR[u.team]}"></span><span class="eq-name">${u.name}</span><span style="color:${TEAM_COLOR[t]};font-size:9px">[${TEAM_NAME[t][0]}]</span><span style="color:#888;font-size:10px">${who}</span><span class="eq-hp">❤${u.hp}/${u.maxHp}</span></div><div class="eq-icons">${u.weapon ? '⚔️' + u.weapon.name : '⚔️无'} ${u.armor ? '🛡️' + u.armor.name : '🛡️无'}</div><div class="eq-detail"><span class="sk">【${u.skill}】</span>${u.sdesc}<br><span class="wp">⚔️</span>${u.weapon ? u.weapon.desc : '无'}<br><span class="ar">🛡️</span>${u.armor ? u.armor.desc : '无'}</div>`;
				d.onclick = () => { u._open = !u._open; renderEquipPanel() };
				list.appendChild(d);
			});
		}
		function buildBadges() {
			const row = document.getElementById('badge-row'); row.innerHTML = '';
			game.activeFactions.forEach(f => { const s = document.createElement('span'); s.className = 'fbadge'; s.id = 'bd-' + f; s.style.background = FCOLOR[f]; row.appendChild(s) });
		}
		function updateTop() {
			const f = game.curFaction; if (!f) return;
			const who = game.isHuman(f) ? '玩家' : 'AI';
			document.getElementById('turn-info').innerText = `回合${game.turnCount}：${FNAME[f]}（${who}）`;
			document.getElementById('turn-info').style.color = FCOLOR[f];
			game.activeFactions.forEach(fa => {
				const bd = document.getElementById('bd-' + fa); if (!bd) return;
				const n = game.alive(fa).length; const tag = game.isHuman(fa) ? 'P' : 'AI'; const t = game.teamOf(fa);
				bd.innerText = `${FNAME[fa][0]}·${tag}${t !== 'S' ? '·' + TEAM_NAME[t][0] : ''}×${n}`;
				bd.className = 'fbadge' + (n === 0 ? ' dead' : ''); bd.style.background = FCOLOR[fa];
			});
		}
		cvs.addEventListener('click', e => {
			if (game.over || pendingResponse) return;
			if (game.curFaction !== NET.myFaction) return;
			const rect = cvs.getBoundingClientRect(); const hex = pxToHex(e.clientX - rect.left, e.clientY - rect.top); if (!hex) return;
			const clicked = game.unitAt(hex.x, hex.y);
			const card = myHand.find(c => c.id === sel.card);
			if (!card && clicked && clicked.team === NET.myFaction) { sel.unit = clicked; sel.card = null; render(); renderHand(); return; }
			if (!sel.unit) { showMsg('请先选择己方武将'); return; }
			const su = sel.unit; if (su.hp <= 0) return;
			if (!card && !clicked) {
				if (su.moved) { showMsg('已移动'); return; }
				if (hexDist(su.x, su.y, hex.x, hex.y) > game.moveSteps(su)) { showMsg('超出移动范围'); return; }
				sendAction({ type: 'move', fx: su.x, fy: su.y, tx: hex.x, ty: hex.y });
				sel.unit = null; render(); return;
			}
			if (card) {
				sendAction({ type: 'useCard', cid: card.id, ux: su.x, uy: su.y, tx: hex.x, ty: hex.y });
				sel.card = null; renderHand(); render();
			}
		});
		const tooltip = document.getElementById('tooltip');
		cvs.addEventListener('mousemove', e => {
			const rect = cvs.getBoundingClientRect(); const hex = pxToHex(e.clientX - rect.left, e.clientY - rect.top);
			const u = hex ? game.unitAt(hex.x, hex.y) : null;
			if (u) {
				tooltip.style.display = 'block';
				const who = game.isHuman(u.team) ? '玩家' : 'AI'; const t = game.teamOf(u.team);
				tooltip.innerHTML = `<b style="color:${FCOLOR[u.team]};font-size:15px">${u.name}</b> ${FNAME[u.team]}（${who}）<br>队伍：<span style="color:${TEAM_COLOR[t]}">${TEAM_NAME[t]}</span><br>❤️${u.hp}/${u.maxHp}<br><span style="color:#7bed9f">【${u.skill}】</span>${u.sdesc}<br>${u.weapon ? '⚔️' + u.weapon.name : '⚔️无'}<br>${u.armor ? '🛡️' + u.armor.name : '🛡️无'}`;
				let tx = e.clientX + 15, ty = e.clientY + 15; if (tx + 260 > innerWidth) tx = e.clientX - 270; if (ty + 180 > innerHeight) ty = e.clientY - 180;
				tooltip.style.left = tx + 'px'; tooltip.style.top = ty + 'px';
			}
			else tooltip.style.display = 'none';
		});
		cvs.addEventListener('mouseleave', () => tooltip.style.display = 'none');

		/* ==================== 聊天系统 ==================== */
		const CHAT = {
			channel: 'all',      // 当前发送频道: all / team / lobby
			viewTab: 'all',      // 当前查看标签: all / team / lobby
			history: [],         // {ch, name, text, time, isSys}
			unread: { all: 0, team: 0, lobby: 0 },
			minimized: true
		};

		function toggleChat() {
			CHAT.minimized = !CHAT.minimized;
			const panel = document.getElementById('chat-panel');
			const icon = document.getElementById('chat-toggle-icon');
			panel.classList.toggle('minimized', CHAT.minimized);
			icon.innerText = CHAT.minimized ? '▲' : '▼';
			if (!CHAT.minimized) {
				// 展开时清除当前tab未读
				CHAT.unread[CHAT.viewTab] = 0;
				updateChatTabs();
				scrollChatBottom();
			}
		}

		function switchChatTab(tab) {
			CHAT.viewTab = tab;
			document.querySelectorAll('.chat-tab').forEach(t => t.classList.toggle('active', t.dataset.ch === tab));
			CHAT.unread[tab] = 0;
			updateChatTabs();
			renderChatMessages();
			scrollChatBottom();
		}

		function cycleChannel() {
			const channels = ['all', 'team', 'lobby'];
			const labels = { all: '全部', team: '队伍', lobby: '大厅' };
			let idx = channels.indexOf(CHAT.channel);
			idx = (idx + 1) % channels.length;
			CHAT.channel = channels[idx];
			document.getElementById('chat-channel-btn').innerText = labels[CHAT.channel];
			document.getElementById('chat-input').placeholder = `[${labels[CHAT.channel]}] 输入消息…`;
		}

		function sendChat() {
			const input = document.getElementById('chat-input');
			const text = input.value.trim();
			if (!text) return;
			input.value = '';

			const msg = { type: 'chatMsg', ch: CHAT.channel, name: NET.myName, text };

			// 本地立即显示
			addChatMessage(CHAT.channel, NET.myName, text, false);

			// 通过现有 toAll 广播（房主也走这个通道）
			socket.emit('toAll', msg);
		}

		// 接收聊天消息（在 handleHostMsg 中添加 case）
		// ★ 需要在 handleHostMsg 的 switch 中加入:
		//   case 'chatMsg': addChatMessage(d.ch, d.name, d.text, false); break;

		function addChatMessage(ch, name, text, isSys) {
			const entry = { ch, name, text, time: new Date(), isSys };
			CHAT.history.push(entry);
			if (CHAT.history.length > 200) CHAT.history.shift(); // 限制历史条数

			// 更新未读
			if (CHAT.minimized || CHAT.viewTab !== ch) {
				if (ch === 'all') { CHAT.unread.all++; CHAT.unread.lobby++; }
				else { CHAT.unread[ch]++; CHAT.unread.all++; }
			}

			updateChatTabs();
			if (CHAT.viewTab === ch || ch === 'all' && CHAT.viewTab === 'all') {
				renderChatMessages();
				scrollChatBottom();
			}
		}

		function renderChatMessages() {
			const container = document.getElementById('chat-messages');
			const filtered = CHAT.history.filter(m =>
				CHAT.viewTab === 'all' ? true : m.ch === CHAT.viewTab || m.ch === 'all'
			);
			container.innerHTML = filtered.map(m => {
				const cls = m.isSys ? 'sys' : (m.ch === 'team' ? 'team' : 'all');
				const nameColor = m.isSys ? '#f39c12' : '#ffd700';
				const prefix = m.ch === 'team' ? '[队]' : (m.ch === 'lobby' ? '[厅]' : '');
				return `<div class="chat-line ${cls}"><span class="cname" style="color:${nameColor}">${prefix}${m.name}：</span>${escapeHtml(m.text)}</div>`;
			}).join('');
		}

		function updateChatTabs() {
			document.querySelectorAll('.chat-tab').forEach(t => {
				const ch = t.dataset.ch;
				const dot = t.querySelector('.unread');
				if (dot) dot.remove();
				if (CHAT.unread[ch] > 0 && CHAT.viewTab !== ch) {
					const span = document.createElement('span');
					span.className = 'unread';
					t.appendChild(span);
				}
			});
		}

		function scrollChatBottom() {
			const c = document.getElementById('chat-messages');
			requestAnimationFrame(() => c.scrollTop = c.scrollHeight);
		}

		function escapeHtml(s) {
			return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
		}

		// ★ 关键：将聊天消息接入现有消息分发
		const _origHandleHostMsg = handleHostMsg;
		handleHostMsg = function (d) {
			if (d.type === 'chatMsg') { addChatMessage(d.ch, d.name, d.text, false); return; }
			_origHandleHostMsg(d);
		};
	</script>
